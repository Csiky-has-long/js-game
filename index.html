<!DOCTYPE html>
<html lang="hu">
<head>
</head>
<body>
    <script>
        const style = document.createElement('style');
        style.textContent = `
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #2c3e50;
                color: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
            }
            h1 {
                margin-bottom: 10px;
            }
            p {
                margin-top: 0;
                color: #bdc3c7;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(4, 80px);
                gap: 10px;
                margin: 20px 0;
            }
            .card {
                width: 80px;
                height: 80px;
                background-color: #34495e;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 32px;
                cursor: pointer;
                border-radius: 8px;
                user-select: none;
                transition: transform 0.2s, background-color 0.2s;
            }
            .card:hover {
                transform: scale(1.05);
            }
            .card.flipped {
                background-color: #ecf0f1;
            }
            .card.matched {
                background-color: #2ecc71;
                cursor: default;
            }
            button {
                background-color: #e74c3c;
                color: white;
                border: none;
                padding: 10px 20px;
                font-size: 16px;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #c0392b;
            }
        `;
        document.head.appendChild(style);

        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐶', '🐱', '🐭', '🐹'];
        let kartyak = [];
        let parok = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        const title = document.createElement('h1');
        title.textContent = 'Memóriajáték';

        const info = document.createElement('p');
        info.textContent = 'Találd meg az összeillő párokat!';

        const grid = document.createElement('div');
        grid.className = 'grid';

        const restartBtn = document.createElement('button');
        restartBtn.textContent = 'Újraindítás';
        restartBtn.onclick = initGame;

        function initGame() {
            grid.innerHTML = '';
            kartyak = [];
            parok = 0;
            info.textContent = 'Találd meg az összeillő párokat!';

            const shuffled = shuffle([...emojis]);

            shuffled.forEach(emoji => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;

                card.addEventListener('click', () => {
                    if (card.classList.contains('flipped') || card.classList.contains('matched') || kartyak.length === 2) {
                        return;
                    }

                    card.classList.add('flipped');
                    card.textContent = emoji;
                    kartyak.push(card);

                    if (kartyak.length === 2) {
                        const [card1, card2] = kartyak;

                        if (card1.dataset.emoji === card2.dataset.emoji) {
                            card1.classList.add('matched');
                            card2.classList.add('matched');
                            kartyak = [];
                            parok++;

                            if (parok === emojis.length / 2) {
                                info.textContent = '🎉 Gratulálok, nyertél!';
                            }
                        } else {
                            setTimeout(() => {
                                card1.classList.remove('flipped');
                                card2.classList.remove('flipped');
                                card1.textContent = '';
                                card2.textContent = '';
                                kartyak = [];
                            }, 800);
                        }
                    }
                });

                grid.appendChild(card);
            });
        }

        document.body.appendChild(title);
        document.body.appendChild(info);
        document.body.appendChild(grid);
        document.body.appendChild(restartBtn);

        initGame();
    </script>
</body>
</html>
